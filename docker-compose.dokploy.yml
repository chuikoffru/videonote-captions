# Separate Postgres service managed by Dokploy.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${POSTGRES_URI:?Set POSTGRES_URI in Dokploy Environment}
      TZ: Europe/Moscow
    tmpfs:
      - /app/temp:uid=1000,gid=1000,mode=0700
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  dokploy-network:
    external: true
